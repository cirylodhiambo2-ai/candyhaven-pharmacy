<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candyhaven Pharmacy Management System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f6f9; color: #333; padding: 30px; }
        header { background: linear-gradient(135deg, #007bff, #0056b3); color: white; padding: 25px; border-radius: 8px; margin-bottom: 25px; text-align: center; }

        #loginOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,123,255,0.95); display: flex; justify-content: center; align-items: center; z-index: 10000; }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 400px; text-align: center; }

        .navigation-hub { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .hub-btn { background: white; padding: 20px; border: 2px solid #007bff; border-radius: 8px; font-size: 1.1rem; font-weight: bold; color: #007bff; cursor: pointer; text-align: center; }
        .hub-btn.active, .hub-btn:hover { background: #007bff; color: white; }
        .workspace-panel { display: none; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        .workspace-panel.active { display: block; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input, select { width: 100%; padding: 11px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #f8f9fa; }
        .fin-card { padding: 18px; border-radius: 6px; color: white; text-align: center; }
        .bg-daily { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .bg-weekly { background: linear-gradient(135deg, #3a7bd5, #3a6073); }
        .bg-lifetime { background: linear-gradient(135deg, #6441A5, #2a0845); }
        .mpesa-section { background: #e8f5e9; padding: 15px; border-radius: 6px; border-left: 4px solid #28a745; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h2 style="color: #007bff; margin-bottom: 10px;">Candyhaven Command</h2>
            <form id="loginForm">
                <div class="form-group" style="text-align: left;">
                    <label>Operator Username</label>
                    <input type="text" id="loginUser" required>
                </div>
                <div class="form-group" style="text-align: left;">
                    <label>Secure Password</label>
                    <input type="password" id="loginPass" required>
                </div>
                <button type="submit" style="background-color: #007bff;">Unlock Terminal</button>
            </form>
        </div>
    </div>

    <div id="dashboardMain" style="display: none;">
        <header>
            <h1>Candyhaven Pharmacy</h1>
            <button onclick="logout()" style="width: auto; padding: 5px 15px; background: #dc3545; font-size: 0.85rem; margin-top: 10px; border-radius: 20px;">Lock Dashboard</button>
        </header>

        <div class="navigation-hub">
            <div class="hub-btn active" onclick="switchPanel('salePanel', this)">🛒 Post a Sale</div>
            <div class="hub-btn" onclick="switchPanel('stockPanel', this)">📦 View Stock Details</div>
            <div class="hub-btn" onclick="switchPanel('addStockPanel', this)">➕ Add More Stock</div>
            <div class="hub-btn" onclick="switchPanel('profitPanel', this)">💰 View Profits</div>
        </div>

        <div id="salePanel" class="workspace-panel active">
            <h2>Log a Retail Transaction</h2>
            <form id="saleForm">
                <div class="form-group"><label>Medicine Name</label><input type="text" id="saleMedicineName" required></div>
                <div class="form-group"><label>Quantity Sold</label><input type="number" id="saleQuantity" required value="1"></div>
                <button type="submit">Complete Transaction</button>
            </form>
        </div>

        <div id="stockPanel" class="workspace-panel">
            <h2>Current Inventory</h2>
            <table id="inventoryTable">
                <thead><tr><th>Name</th><th>Category</th><th>Stock</th><th>Price</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <div id="addStockPanel" class="workspace-panel">
            <h2>Register New Batch</h2>
            <form id="medicineForm">
                <div class="form-group"><label>Name</label><input type="text" id="name" required></div>
                <div class="form-group"><label>Quantity</label><input type="number" id="quantity" required></div>
                <div class="form-group"><label>Selling Price</label><input type="number" id="sellingPrice" required></div>
                <button type="submit">Add to Inventory</button>
            </form>
        </div>

        <div id="profitPanel" class="workspace-panel">
            <h2>Financial Hub</h2>
            <table id="historyTable">
                <thead><tr><th>Item</th><th>Qty</th><th>Total</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        async function login() {
    console.log("Button clicked!"); // Add this line
    const user = document.getElementById("loginUser").value;
    const pass = document.getElementById("loginPass").value;
    
    // ... rest of your code
}
        // --- CONFIGURE YOUR KEYS HERE ---
        const supabase = supabase.createClient('YOUR_SUPABASE_URL', 'YOUR_SUPABASE_KEY');

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const user = document.getElementById("loginUser").value;
            const pass = document.getElementById("loginPass").value;

            // Simple login query
            const { data, error } = await supabase.from('users').select('*').eq('username', user).eq('password', pass);
            
            if (data && data.length > 0) {
                document.getElementById("loginOverlay").style.display = "none";
                document.getElementById("dashboardMain").style.display = "block";
                fetchInventory();
            } else {
                alert("Invalid Credentials");
            }
        });

        async function fetchInventory() {
            const { data } = await supabase.from('medicines').select('*');
            const tbody = document.querySelector("#inventoryTable tbody");
            tbody.innerHTML = "";
            data.forEach(med => {
                tbody.innerHTML += `<tr><td>${med.name}</td><td>${med.category}</td><td>${med.stock_quantity}</td><td>${med.selling_price}</td></tr>`;
            });
        }

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    
    // Get values from your input fields
    const user = document.getElementById("loginUser").value;
    const pass = document.getElementById("loginPass").value;

    // Use Supabase instead of the old fetch(127.0.0.1...)
    const { data, error } = await supabase
        .from('users') // Make sure this table exists in Supabase!
        .select('*')
        .eq('username', user)
        .eq('password', pass);

    if (data && data.length > 0) {
        console.log("Login successful!");
        document.getElementById("loginOverlay").style.display = "none";
        document.getElementById("dashboardMain").style.display = "block";
        fetchInventory(); // This now connects to Supabase too
    } else {
        alert("Authentication failed! Check credentials or DB connection.");
        console.error("Login Error:", error);
    }
});

        function logout() { location.reload(); }
        function switchPanel(p, btn) {
            document.querySelectorAll('.workspace-panel').forEach(p => p.classList.remove('active'));
            document.getElementById(p).classList.add('active');
        }
    </script>
</body>
</html>
